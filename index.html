<script>
var TOKEN=null,REP=null,TAB='tong',SORT={},MOD={rows:[],sort:{k:null,d:1},title:''};
var f0=function(n){return n===null||n===undefined?'—':Number(n).toLocaleString('vi-VN')};
var fp=function(n){return n===null||n===undefined?'N/A':(Math.round(n*10)/10).toLocaleString('vi-VN')+'%'};
var fm=function(n){return n?(Math.round(n/1e5)/10).toLocaleString('vi-VN')+' tr':'0'};
function busy(b){document.getElementById('loading').style.display=b?'block':'none'}
function call(fn,args,ok){busy(true);var r=google.script.run.withSuccessHandler(function(x){busy(false);ok(x)}).withFailureHandler(function(e){busy(false);
  var m=String(e.message||e);if(m.indexOf('PHIEN_HET_HAN')>-1){alert('Phiên đăng nhập đã hết hạn hoặc tài khoản vừa được thay đổi. Vui lòng đăng nhập lại.');doLogout();return}
  if(m.indexOf('PHAI_DOI_MK')>-1){showPw(true);return}alert('Lỗi: '+(e.message||e))});r[fn].apply(r,args)}
function doLogin(){var u=lu.value.trim(),p=lp.value;if(!u||!p){lerr.textContent='Nhập tài khoản và mật khẩu';return}
  call('login',[u,p],function(x){if(!x.ok){lerr.textContent=x.msg;return}TOKEN=x.token;try{sessionStorage.setItem('bw_t',TOKEN)}catch(e){}
  document.getElementById('login').classList.add('hide');app.classList.remove('hide');USER=x.user;if(x.user.mustChange){pw0.value=p;showPw(true)}else refresh(false)})}
lp.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
function doLogout(){if(TOKEN)google.script.run.logout(TOKEN);TOKEN=null;try{sessionStorage.removeItem('bw_t')}catch(e){}location.reload()}
(function(){try{var t=sessionStorage.getItem('bw_t');if(t){TOKEN=t;document.getElementById('login').classList.add('hide');app.classList.remove('hide');refresh(false)}}catch(e){}})();
function refresh(force){call('getReport',[TOKEN,!!force],function(r){REP=r;
  var t=r.today;hsub.textContent='Hôm nay '+t.d+'/'+t.m+'/'+t.y+' · Dữ liệu đọc lúc '+r.builtAt+' · Nền tháng trước: '+r.prevSheet+' · Web '+WEB_VER+' / máy chủ '+String(r.version||'').replace('BILLWEB_','');
  who.textContent=r.user.u+' ('+({OWNER:'Chủ web',ADMIN:'Đồng quản lý',KTV:'KTV'}[r.user.role]||r.user.role)+')';btnRef.style.display=isAdmin()?'':'none';buildNav();render()})}
function isAdmin(){return REP&&(REP.user.role==='ADMIN'||REP.user.role==='OWNER')}
function isOwner(){return REP&&REP.user.role==='OWNER'}
function buildNav(){var tabs=isAdmin()?[['tong','Tổng quan'],['ktv','Tiến độ KTV'],['nhac','Nhắc lịch T+1/2/5 & trễ'],['bay','Theo Bầy'],['khoa','KH bị khóa cước'],['up','📷 Up ảnh onsite'],['xanh','Báo cáo ảnh onsite'],['ttol','Chuyển dịch TTOL'],['dl','Chất lượng dữ liệu']].concat(isOwner()?[['acc','Tài khoản']]:[])
  :[['toi','Của tôi'],['up','📷 Up ảnh onsite'],['xanh','Ảnh của tôi'],['khoa','KH bị khóa của tôi'],['ktv','Xếp hạng KTV'],['ttol','TTOL của tôi']];if(!tabs.some(function(x){return x[0]===TAB}))TAB=tabs[0][0];
  nav.innerHTML=tabs.map(function(x){return '<a class="'+(x[0]===TAB?'on':'')+'" onclick="TAB=\''+x[0]+'\';buildNav();render()">'+x[1]+'</a>'}).join('')}

/* ---------- định nghĩa cột ---------- */
function dd(off){var t=REP.today,d=new Date(t.y,t.m-1,t.d+off);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)}
function lb(c){return typeof c.t==='function'?c.t():c.t}
var C_DAY=[{k:'paidD0',t:function(){return 'Thu hôm nay '+dd(0)},n:1},{k:'paidD1',t:function(){return 'Hôm qua '+dd(-1)},n:1},{k:'paidD2',t:function(){return 'Hôm kia '+dd(-2)},n:1}];
var C_PROG=[{k:'pc',t:'Phân công',n:1},{k:'paid',t:'Đã TT',n:1},{k:'paidPct',t:'% TT',f:'pct'}].concat(C_DAY,[{k:'msGap',t:'Thiếu so mốc',f:'gap'},{k:'nextGap',t:'Thiếu mốc kế',f:'int'},
  {k:'ton',t:'Tồn',n:1},{k:'tienTon',t:'Tiền tồn',f:'money'},{k:'tonNoLydo',t:'Tồn chưa lý do',n:1},{k:'lydoPct',t:'% trả lý do',f:'lydo'},
  {k:'overdue',t:'Trễ so LS',n:1},{k:'paidEarly',t:'TT sớm hơn LS',n:1},{k:'paidLate',t:'Đã TT nhưng trễ',n:1},{k:'lydoOther',t:'Lý do do người khác trả',n:1},{k:'moved',t:'↑ TTOL phát sinh',n:1},{k:'reverse',t:'↓ Dịch chuyển ngược',n:1},{k:'net',t:'TTOL ròng',f:'net'},{k:'ttolPct',t:'% TTOL',f:'ttol'},{k:'_nx',t:'Nhận xét',f:'nx'}]);
var C_NHAC=[{k:'dueToday',t:function(){return 'Đến hạn hôm nay '+dd(0)},n:1,f:'due'},{k:'up1',t:function(){return 'Ngày mai T+1 '+dd(1)},n:1,f:'due'},{k:'up2',t:function(){return 'Ngày kia T+2 '+dd(2)},n:1,f:'due'},{k:'up5',t:function(){return 'T+5 '+dd(5)},n:1,f:'due'},{k:'win5',t:'Trong 5 ngày tới',n:1},
  {k:'od1',t:'Trễ 1 ngày',n:1},{k:'od3',t:'Trễ 2–3 ngày',n:1},{k:'od5',t:'Trễ 4–5 ngày',n:1},{k:'od6',t:'Trễ >5 ngày',n:1},{k:'overdue',t:'Tổng trễ',n:1},{k:'noHist',t:'Chưa có LS T-1',n:1},

 '<div><button class="btn" onclick="addUser()">+ Thêm / cập nhật</button></div></div>'+
 '<div class="tools"><button class="btn s" onclick="syncU()">⟳ Tự thêm KTV mới từ dữ liệu</button><input id="uf" placeholder="Tìm tài khoản..." oninput="renderUsers()"><button class="mini" onclick="showLog()">Xem nhật ký</button><span class="note" id="ust"></span></div><div id="ubox"></div><div id="lbox"></div>'}
function loadUsers(){call('adminListUsers',[TOKEN],function(r){USERS=r;renderUsers()})}
function renderUsers(){var q=(document.getElementById('uf')||{}).value||'';q=q.toLowerCase();var rows=USERS.filter(function(u){return !q||(u.u+' '+u.name+' '+u.scope+' '+u.note).toLowerCase().indexOf(q)>-1});
 ust.textContent=USERS.length+' tài khoản · '+USERS.filter(function(u){return !u.active||u.fail>=5}).length+' đang khóa · '+USERS.filter(function(u){return u.temp}).length+' chưa đổi MK tạm';
 ubox.innerHTML='<div class="tw"><table><thead><tr><th>Mã</th><th>Họ tên / đơn vị</th><th>Vai trò</th><th>Phạm vi</th><th>Trạng thái</th><th>MK tạm (chưa đổi)</th><th>Đăng nhập cuối</th><th>Ghi chú</th><th>Thao tác</th></tr></thead><tbody>'+
 rows.map(function(u){var st=!u.active?'<span class="r">Đã khóa</span>':(u.fail>=5?'<span class="r">Khóa do sai MK</span>':(u.fail?'<span class="a">Sai '+u.fail+' lần</span>':'<span class="g">Hoạt động</span>'));
  var role={OWNER:'Chủ web',ADMIN:'Đồng quản lý',KTV:'KTV'}[u.role]||u.role,own=u.role==='OWNER';
  return '<tr><td class="t"><b>'+esc(u.u)+'</b></td><td class="t">'+esc(u.name)+'</td><td class="t">'+role+'</td><td class="t">'+esc(u.scope)+'</td><td class="t">'+st+'</td><td class="t">'+(u.temp?'<span class="tmp">'+esc(u.temp)+'</span>':'—')+'</td><td>'+esc(u.last)+'</td><td class="t">'+esc(u.note)+'</td><td class="t">'+
  (own?'':'<button class="mini" onclick="resetU(\''+u.u+'\')">Cấp lại MK</button><button class="mini" onclick="actU(\''+u.u+'\','+(!u.active||u.fail>=5)+')">'+(!u.active||u.fail>=5?'Mở khóa':'Khóa')+'</button><button class="mini" onclick="editU(\''+u.u+'\')">Sửa</button>')+'</td></tr>'}).join('')+'</tbody></table></div>'}
function addUser(){var o={u:nu.value.trim(),name:nn.value.trim(),role:nr.value,scope:nsc.value.trim(),note:nno.value.trim()};if(!o.u){alert('Nhập mã đăng nhập');return}
 call('adminSaveUser',[TOKEN,o],function(x){if(!x.ok){alert(x.msg);return}alert(x.msg+(x.temp?'\nMật khẩu tạm: '+x.temp+'\n(Gửi riêng cho người dùng; họ phải đổi ngay ở lần đăng nhập đầu.)':''));nu.value=nn.value=nsc.value=nno.value='';loadUsers()})}
function editU(u){var x=USERS.filter(function(z){return z.u===u})[0];nu.value=x.u;nn.value=x.name;nr.value=x.role==='ADMIN'?'ADMIN':'KTV';nsc.value=x.role==='ADMIN'?'':x.scope;nsc.disabled=x.role==='ADMIN';nno.value=x.note;nu.focus()}
function resetU(u){if(!confirm('Cấp lại mật khẩu tạm cho '+u+'?\nMật khẩu cũ hết hiệu lực, người dùng bị thoát và phải đổi MK khi đăng nhập lại.'))return;
 call('adminResetPw',[TOKEN,u],function(x){if(!x.ok){alert(x.msg);return}alert('Mật khẩu tạm của '+u+': '+x.temp+'\nGửi riêng cho người dùng (Fchat/Zalo cá nhân, không gửi vào nhóm).');loadUsers()})}
function actU(u,open){if(!open&&!confirm('Khóa tài khoản '+u+'? Người này bị thoát ngay.'))return;call('adminSetActive',[TOKEN,u,open],function(x){if(!x.ok)alert(x.msg);loadUsers()})}
function syncU(){call('adminSync',[TOKEN],function(x){alert(x.added.length?'Đã thêm '+x.added.length+' tài khoản KTV: '+x.added.join(', ')+'\nMK tạm hiện trong bảng.':'Không có KTV mới.');loadUsers()})}
function showLog(){call('adminLog',[TOKEN],function(r){lbox.innerHTML='<h3>Nhật ký 300 thao tác gần nhất</h3><div class="tw"><table><thead><tr><th>Thời điểm</th><th>Người</th><th>Hành động</th><th>Chi tiết</th></tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(v){return '<td class="t">'+esc(v)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'})}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM()});
</script>
</body>
</html>
